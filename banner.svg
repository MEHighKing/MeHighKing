<svg width="100%" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7FB">
        <animate attributeName="stop-color"
          values="#F3E7FB;#FDE2E4;#E2ECFB;#F3E7FB"
          dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#FBE4EF">
        <animate attributeName="stop-color"
          values="#FBE4EF;#EAE0FB;#FDEFF2;#FBE4EF"
          dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#E8DFFB">
        <animate attributeName="stop-color"
          values="#E8DFFB;#F6E5F6;#E4EEFC;#E8DFFB"
          dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" rx="28" fill="url(#bgGrad)"/>

  <!-- far layer: slow drifting big blobs (parallax back layer) -->
  <circle cx="120" cy="60" r="90" fill="url(#glow)">
    <animate attributeName="cy" values="60;90;60" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="200" r="110" fill="url(#glow)">
    <animate attributeName="cy" values="200;170;200" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- mid layer: pastel floating circles, faster drift = parallax mid layer -->
  <g opacity="0.7">
    <circle cx="90" cy="210" r="14" fill="#F7C6D9">
      <animate attributeName="cy" values="210;185;210" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="40" r="10" fill="#C9E4FF">
      <animate attributeName="cy" values="40;65;40" dur="5.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.85;0.4" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="220" r="8" fill="#E3D3FA">
      <animate attributeName="cy" values="220;195;220" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="55" r="12" fill="#FBD5E8">
      <animate attributeName="cy" values="55;30;55" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="130" r="9" fill="#CDE7DD">
      <animate attributeName="cy" values="130;105;130" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="215" r="7" fill="#FFF0C9">
      <animate attributeName="cy" values="215;190;215" dur="5.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="30" r="6" fill="#D9C9F5">
      <animate attributeName="cy" values="30;55;30" dur="4.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- foreground sparkle accents near text, twinkle -->
  <g fill="#B79CE0">
    <path d="M175 95 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" opacity="0.9">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M1030 95 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" fill="#E8A6C4" opacity="0.9">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M960 175 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#9FC8E8" opacity="0.9">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- title: reliable fade + rise in, no clipping so nothing gets cut off -->
  <g>
    <text x="140" y="150" font-family="Segoe UI, Verdana, sans-serif" font-size="50" font-weight="700" fill="#6B4E8E" opacity="0">
      FrozenPhoenix // MEHighKing
      <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="1.2s" fill="freeze"/>
      <animate attributeName="y" from="168" to="150" begin="0.2s" dur="1.2s" fill="freeze"/>
    </text>
  </g>

  <text x="142" y="188" font-family="Segoe UI, Verdana, sans-serif" font-size="20" fill="#8C6FB0" opacity="0">
    Linux tinkerer &#183; fantasy reader &#183; football &#183; Clash of Clans
    <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="1s" fill="freeze"/>
  </text>

  <!-- underline draw-on -->
  <line x1="142" y1="200" x2="142" y2="200" stroke="#D9A9C4" stroke-width="3" stroke-linecap="round">
    <animate attributeName="x2" from="142" to="640" begin="1.5s" dur="1s" fill="freeze"/>
  </line>
</svg>
